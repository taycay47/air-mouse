        const ctx = bgCanvas.getContext('2d');
        let dots = [];
        let canvasWidth, canvasHeight;
        const SPACING       = 22;
        const PROX_RADIUS   = 80;    // px — continuous finger glow radius
        const RIPPLE_SPEED  = 320;   // px/s
        const RIPPLE_WIDTH  = 55;    // px — width of exciting ring
        const RIPPLE_MAX_R  = 150;   // px — ripple fully fades by this radius
        let touchTarget = { x: -1000, y: -1000, active: false };
        let ripples = [];
        let lastTickTime = performance.now();
        const OFFLINE_PULSE_MS = 1400;   // gap between disconnected centre pulses
        let lastOfflinePulse = 0;
        const FLASH_MS = 1100;           // how long a success pulse tints the grid
        let flash = null;                // { rgb, start } — active success pulse
        // Drag ripple throttling
        let lastRippleX = -9999, lastRippleY = -9999, lastRippleMs = 0;
        const MIN_RIPPLE_DIST = 22;  // px of movement before next ripple
        const MIN_RIPPLE_MS   = 50;  // ms between ripples (caps rate)

        function initCanvas() {
            const rect = bgCanvas.getBoundingClientRect();
            // Reallocating the backing buffer and rebuilding the dot grid is the most
            // expensive thing on this page, so skip it when the size is unchanged.
            if (rect.width === canvasWidth && rect.height === canvasHeight) return;

            canvasWidth = rect.width;
            canvasHeight = rect.height;
            bgCanvas.width = Math.round(canvasWidth * window.devicePixelRatio);
            bgCanvas.height = Math.round(canvasHeight * window.devicePixelRatio);
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            dots = [];
            for (let x = 0; x <= canvasWidth + SPACING; x += SPACING) {
                for (let y = 0; y <= canvasHeight + SPACING; y += SPACING) {
                    dots.push({ baseX: x, baseY: y, excited: 0 });
                }
            }
        }

        function spawnRipple(x, y) {
            ripples.push({ x, y, radius: 0 });
            lastRippleX  = x;
            lastRippleY  = y;
            lastRippleMs = performance.now();
        }

        function tryDragRipple(x, y) {
            const now = performance.now();
            const dx  = x - lastRippleX;
            const dy  = y - lastRippleY;
            const d   = Math.sqrt(dx * dx + dy * dy);
            if (d > MIN_RIPPLE_DIST || now - lastRippleMs > MIN_RIPPLE_MS) {
                spawnRipple(x, y);
            }
        }
        
        window.addEventListener('resize', initCanvas);
        if (window.visualViewport) {
            // The scene is resized to the visual viewport, so the grid has to
            // be rebuilt when the keyboard opens or closes.
            //
            // Debounced, unlike the scene tracking above: visualViewport fires every
            // frame of the keyboard animation (see ADR-0003), and rebuilding the canvas
            // buffer and dot grid dozens of times in a row starves the main thread —
            // which showed up as the trackpad going unresponsive while the keyboard
            // animated. The grid only has to be right once the viewport settles.
            let gridRebuildTimer = null;
            window.visualViewport.addEventListener('resize', () => {
                clearTimeout(gridRebuildTimer);
                gridRebuildTimer = setTimeout(initCanvas, 150);
            });
        }
        initCanvas();
        
        (function tick() {
            requestAnimationFrame(tick);
            const now = performance.now();
            const dt  = Math.min((now - lastTickTime) / 1000, 0.05);
            lastTickTime = now;

            // A queued success pulse fires one ripple from the centre and
            // tints the grid as it travels.
            if (pendingPulse) {
                flash = { rgb: pendingPulse, start: now };
                pendingPulse = null;
                ripples.push({ x: canvasWidth / 2, y: canvasHeight / 2, radius: 0 });
            }
            const flashMix = flash
                ? Math.max(0, 1 - (now - flash.start) / FLASH_MS)
                : 0;
            if (flash && flashMix === 0) flash = null;

            // While disconnected, pulse a ripple out from the centre so the
            // surface itself signals the lost connection.
            if (isOffline && now - lastOfflinePulse > OFFLINE_PULSE_MS) {
                lastOfflinePulse = now;
                ripples.push({ x: canvasWidth / 2, y: canvasHeight / 2, radius: 0 });
            }

            // Advance and prune ripples
            for (let j = 0; j < ripples.length; j++) ripples[j].radius += RIPPLE_SPEED * dt;
            ripples = ripples.filter(r => r.radius < RIPPLE_MAX_R + RIPPLE_WIDTH);

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            const tX = touchTarget.x;
            const tY = touchTarget.y;
            // The dots must dissolve into the keyboard edge too, or they end
            // in a hard row exactly where the glow is being faded out.
            const EDGE_FADE = 110;
            const fadeStart = canvasHeight - EDGE_FADE;

            for (let i = 0; i < dots.length; i++) {
                const dot = dots[i];
                let excitement = 0;

                // Continuous finger glow (hold / drag)
                if (touchTarget.active) {
                    const dx = dot.baseX - tX;
                    const dy = dot.baseY - tY;
                    const d  = Math.sqrt(dx * dx + dy * dy);
                    if (d < PROX_RADIUS) {
                        excitement = Math.max(excitement, Math.pow(1 - d / PROX_RADIUS, 1.8));
                    }
                }

                // Ripple waves (with amplitude falloff so they fade before edge)
                for (let j = 0; j < ripples.length; j++) {
                    const r  = ripples[j];
                    const dx = dot.baseX - r.x;
                    const dy = dot.baseY - r.y;
                    const d     = Math.sqrt(dx * dx + dy * dy);
                    const delta = r.radius - d;
                    if (delta > -12 && delta < RIPPLE_WIDTH) {
                        const lead      = delta < 0  ? Math.max(0, 1 + delta / 12) : 1;
                        const trail     = delta >= 0 ? (1 - delta / RIPPLE_WIDTH)  : 1;
                        // Amplitude: clamp base to 0 first — Math.pow(negative, 1.4) = NaN
                        const amplitude = Math.pow(Math.max(0, 1 - r.radius / RIPPLE_MAX_R), 1.4);
                        excitement = Math.max(excitement, lead * trail * amplitude);
                    }
                }

                // Blue wash rising from the bottom while the keyboard is open
                // Fade the last rows out while the keyboard is up so the grid
                // meets the keyboard on black rather than on a line of dots.
                const edgeFade = (keyboardOpen && dot.baseY > fadeStart)
                    ? Math.max(0, 1 - (dot.baseY - fadeStart) / EDGE_FADE)
                    : 1;

                // Lerp toward target: snappy up (0.35), slow decay (0.10 ≈ 0.5s)
                const lerpSpeed = excitement > dot.excited ? 0.35 : 0.10;
                dot.excited += (excitement - dot.excited) * lerpSpeed;

                const e = dot.excited;

                // Fast path for resting dots
                if (e < 0.008) {
                    ctx.beginPath();
                    ctx.arc(dot.baseX, dot.baseY, 1, 0, Math.PI * 2);
                    if (flashMix > 0) {
                        const [fr, fg, fb] = flash.rgb;
                        ctx.fillStyle = `rgba(${fr},${fg},${fb},${((0.07 + 0.18 * flashMix) * edgeFade).toFixed(3)})`;
                    } else {
                        ctx.fillStyle = isOffline
                            ? `rgba(255,88,78,${(0.10 * edgeFade).toFixed(3)})`
                            : `rgba(255,255,255,${(0.07 * edgeFade).toFixed(3)})`;
                    }
                    ctx.fill();
                    continue;
                }

                // Visuals derived from excitement
                const sizeRatio = Math.pow(e, 1.8);
                const drawSize  = 1 + sizeRatio * 5.5;        // was 3.2 — bigger peak size
                const baseAlpha = 0.07 + e * 0.93;            // was 0.83 — brighter at peak
                const flicker   = (Math.random() - 0.5) * 0.22 * e;
                const drawAlpha = Math.max(0, baseAlpha + flicker);
                // Colour: near-white normally, red while disconnected, blended
                // toward blue near the keyboard.
                let cr, cg, cb;
                if (isOffline) {
                    const gb = 40 + 150 * (1 - e);
                    cr = 255; cg = gb; cb = gb;
                } else {
                    const c = 215 + 40 * e;
                    cr = 255; cg = c; cb = c;
                }
                if (flashMix > 0) {
                    cr += (flash.rgb[0] - cr) * flashMix;
                    cg += (flash.rgb[1] - cg) * flashMix;
                    cb += (flash.rgb[2] - cb) * flashMix;
                }

                ctx.beginPath();
                ctx.arc(dot.baseX, dot.baseY, drawSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${cr | 0},${cg | 0},${cb | 0},${drawAlpha * edgeFade})`;
                ctx.fill();
            }
        })();

        // Touch events. Coordinates are mapped through the canvas's own rect so
        // the dots land under the finger no matter where the viewport sits.
        function canvasPoint(t) {
            const rect = bgCanvas.getBoundingClientRect();
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }

        touchSurface.addEventListener('touchstart', (e) => {
            if (currentMode === 'trackpad' && e.touches.length > 0) {
                const p = canvasPoint(e.touches[0]);
                touchTarget = { x: p.x, y: p.y, active: true };
                spawnRipple(p.x, p.y);
            }
        }, { passive: false });

        touchSurface.addEventListener('touchmove', (e) => {
            if (currentMode === 'trackpad' && e.touches.length > 0) {
                const p = canvasPoint(e.touches[0]);
                touchTarget = { x: p.x, y: p.y, active: true };
                tryDragRipple(p.x, p.y);   // spawn ripples along drag path
            }
        }, { passive: false });

        touchSurface.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                touchTarget = { x: -1000, y: -1000, active: false };
            } else {
                const p = canvasPoint(e.touches[0]);
                touchTarget = { x: p.x, y: p.y, active: true };
            }
        }, { passive: false });
    </script>
</body>
</html>
