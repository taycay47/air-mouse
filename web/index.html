<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Minimal mobile trackpad and air mouse controller for macOS.">
    <title>Mac Remote Controller</title>
    <script src="vendor/motion.js"></script>
    <style>
        :root {
            /* Neutral system palette — no accent gradient, no glows. */
            --bg: #000;
            --surface: rgba(30, 30, 32, 0.72);
            --surface-raised: rgba(48, 48, 51, 0.8);
            --hairline: rgba(255, 255, 255, 0.12);
            --hairline-strong: rgba(255, 255, 255, 0.2);
            --fill: rgba(255, 255, 255, 0.08);
            --fill-active: rgba(255, 255, 255, 0.16);
            --text: rgba(255, 255, 255, 0.92);
            --text-2: rgba(235, 235, 245, 0.6);
            --text-3: rgba(235, 235, 245, 0.3);
            /* Global tint, as an RGB triplet so it can drive canvas + CSS alike.
               Flips to red while the connection is down (see body.offline). */
            --tint: 255, 255, 255;
            --tint-solid: rgba(255, 255, 255, 0.92);
            --alert: 255, 69, 58;
            --blur: 30px;
            --r-sm: 10px;
            --r-md: 16px;
            --r-lg: 22px;
            --ease: cubic-bezier(0.32, 0.72, 0, 1);
        }

        /* Connection lost: the whole surface reads red and the dot grid pulses
           from the centre (driven in JS). No separate status light needed. */
        body.offline {
            --tint: var(--alert);
            --tint-solid: rgb(255, 69, 58);
            --text: rgba(255, 138, 128, 0.92);
            --text-2: rgba(255, 138, 128, 0.6);
            --text-3: rgba(255, 138, 128, 0.32);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            font: 400 17px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text',
                  'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            /* Fixed and inset: the document has no scrollable overflow at all,
               so the keyboard cannot push the scene up. */
            position: fixed;
            inset: 0;
            overflow: hidden;
            overscroll-behavior: none;
            transition: color 0.5s var(--ease);
        }

        #scene {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            transform: translateY(0);
            will-change: transform;
            overflow: visible;
        }

        #touch-surface {
            position: fixed;
            inset: 0;
            z-index: 1;
            touch-action: none;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient blue field rising from the bottom. Always present, and
           brought up when the keyboard opens. */
        #ambient-glow {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 62vh;
            z-index: 2;
            pointer-events: none;
            opacity: 0.42;      /* ambient level */
            transition: opacity 0.5s var(--ease);
            background: radial-gradient(135% 105% at 50% 96%,
                rgba(10, 132, 255, 0.42) 0%,
                rgba(10, 132, 255, 0.24) 24%,
                rgba(10, 132, 255, 0.08) 50%,
                rgba(10, 132, 255, 0) 76%);
        }

        /* Lifted while typing, and suppressed while disconnected so the red
           state reads unambiguously. */
        body.kb-open #ambient-glow {
            /* Same colour and strength as at rest; only the bottom is
               dissolved so it can meet the keyboard's black without a seam. */
            -webkit-mask-image: linear-gradient(to bottom,
                #000 0%, #000 72%, rgba(0, 0, 0, 0.55) 90%, transparent 100%);
            mask-image: linear-gradient(to bottom,
                #000 0%, #000 72%, rgba(0, 0, 0, 0.55) 90%, transparent 100%);
        }
        body.offline #ambient-glow { opacity: 0; }


        /* Config — two hairlines. Sits in the input bar, left of the field. */
        .config-btn {
            flex-direction: column;
            gap: 5px;
        }

        .config-btn span {
            display: block;
            width: 17px;
            height: 1.5px;
            border-radius: 1px;
            background: currentColor;
            opacity: 0.85;
        }

        /* Settings — Apple-style bottom sheet */
        .sheet-scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease);
            z-index: 100;
        }

        .sheet-scrim.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 88dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--surface);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border-top: 0.5px solid var(--hairline);
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
            transform: translateY(100%);
            transition: transform 0.45s var(--ease);
            z-index: 101;
        }

        .sheet-scrim.active .sheet { transform: translateY(0); }

        .sheet-grabber {
            width: 36px;
            height: 5px;
            border-radius: 3px;
            background: var(--hairline-strong);
            margin: 0 auto 18px;
        }

        /* Grouped inset list, like iOS Settings */
        .group {
            background: var(--fill);
            border-radius: var(--r-md);
            overflow: hidden;
            margin-bottom: 22px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 13px 16px;
            min-height: 48px;
        }

        .row + .row { border-top: 0.5px solid var(--hairline); }

        .row-label {
            font-size: 17px;
            color: var(--text);
            flex-shrink: 0;
        }

        .group-title {
            font-size: 13px;
            color: var(--text-2);
            padding: 0 16px 7px;
            letter-spacing: -0.01em;
        }

        /* Segmented control (Trackpad / Air Mouse) */
        .segmented {
            display: flex;
            background: var(--fill);
            border-radius: 9px;
            padding: 2px;
            flex: 1;
            max-width: 200px;
        }

        .segment {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.25s var(--ease);
        }

        .segment.active { background: var(--surface-raised); }

        /* Slider */
        .slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            max-width: 200px;
            height: 4px;
            border-radius: 2px;
            background: var(--fill-active);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
            cursor: pointer;
        }

        /* Shortcut chips */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 13px 16px;
        }

        .chip {
            flex: 1 1 auto;
            min-width: 62px;
            background: var(--fill);
            border: 0.5px solid var(--hairline);
            color: var(--text);
            font: inherit;
            font-size: 15px;
            padding: 9px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: background 0.2s var(--ease), transform 0.2s var(--ease);
        }

        .chip:active {
            background: var(--fill-active);
            transform: scale(0.95);
        }

        /* Plain full-width text actions */
        .sheet-action {
            width: 100%;
            background: var(--fill);
            border: none;
            color: var(--text);
            font: inherit;
            font-size: 17px;
            padding: 14px;
            border-radius: var(--r-md);
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s var(--ease);
        }

        .sheet-action:active { background: var(--fill-active); }
        .sheet-action.prominent { font-weight: 600; }

        /* Pairing PIN — same sheet language, centred dialog */
        .pairing-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease);
            z-index: 300;
        }

        .pairing-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pairing-content {
            background: var(--surface);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 0.5px solid var(--hairline);
            border-radius: var(--r-lg);
            padding: 24px 20px 20px;
            width: 84%;
            max-width: 300px;
            text-align: center;
        }

        .pairing-content h4 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .pairing-content p {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 18px;
        }

        #pairing-pin-input {
            width: 100%;
            font: inherit;
            font-size: 28px;
            letter-spacing: 8px;
            text-align: center;
            background: var(--fill);
            border: 0.5px solid var(--hairline);
            border-radius: var(--r-sm);
            color: var(--tint-solid);
            caret-color: var(--tint-solid);
            padding: 12px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        #pairing-error {
            min-height: 18px;
            font-size: 13px;
            color: rgb(255, 69, 58);
            margin-top: 10px;
        }

        /* Toast — quiet, centred, no border glow */
        .toast {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
            left: 50%;
            transform: translate(-50%, 8px);
            background: var(--surface-raised);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 0.5px solid var(--hairline);
            padding: 9px 16px;
            border-radius: 100px;
            font-size: 14px;
            color: var(--text);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        body.kb-open .toast {
            bottom: 64px;
        }

        /* Visually Hidden Accessibility elements */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Contextual actions, sitting just above the input bar. Only present
           when the Mac actually has something to copy or paste. */
        .context-pills {
            position: fixed;
            left: calc(env(safe-area-inset-left, 0px) + 12px);
            right: calc(env(safe-area-inset-right, 0px) + 12px);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px + 52px);
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            z-index: 51;
            pointer-events: none;
        }

        .context-pill {
            display: none;
            align-items: center;
            gap: 6px;
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            background: var(--surface-raised);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 0.5px solid var(--hairline);
            border-radius: 100px;
            padding: 8px 15px 8px 12px;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            /* opacity + transform are animated by Motion, not by CSS */
            will-change: transform, opacity;
        }

        .context-pill:active { background: var(--fill-active); }

        .context-pill svg {
            width: 16px;
            height: 16px;
            opacity: 0.75;
        }

        /* ── Bottom input bar: text field fills, mic sits to its right ────── */
        .input-bar {
            position: fixed;
            left: calc(env(safe-area-inset-left, 0px) + 12px);
            right: calc(env(safe-area-inset-right, 0px) + 12px);
            bottom: 0;
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 50;
        }

        /* Keyboard covers the home indicator, so its inset no longer applies.
           Flush against the keyboard — no padding of our own. */
        body.kb-open .input-bar {
            padding-bottom: 0;
        }

        body.kb-open .context-pills {
            bottom: 52px;
        }

        .text-input {
            flex: 1 1 auto;
            min-width: 0;
            font: inherit;
            font-size: 17px;
            text-align: left;
            color: var(--tint-solid);
            caret-color: var(--tint-solid);
            background: var(--surface);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 0.5px solid var(--hairline);
            border-radius: 100px;
            padding: 11px 18px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
            transition: border-color 0.25s var(--ease), color 0.5s var(--ease);
        }

        .text-input::placeholder {
            color: var(--text-3);
        }

        .text-input:focus {
            border-color: var(--hairline-strong);
        }

        /* Un-sent dictation awaiting review */
        .text-input.pending {
            border-color: var(--hairline-strong);
            background: var(--surface-raised);
        }

        /* Circular buttons to the right — width follows content, never stretch */
        .bar-btn {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 0.5px solid var(--hairline);
            color: var(--tint-solid);
            cursor: pointer;
            touch-action: none;
            -webkit-touch-callout: none;
            transition: transform 0.25s var(--ease), background 0.25s var(--ease),
                        color 0.5s var(--ease), opacity 0.25s var(--ease);
        }

        .bar-btn svg {
            width: 21px;
            height: 21px;
        }

        .bar-btn:active { transform: scale(0.9); }

        /* Mic: hold to speak. Recording simply fills; no glow, no ripple ring. */
        .mic-btn.recording {
            background: rgb(255, 69, 58);
            border-color: rgb(255, 69, 58);
            color: #fff;
            animation: mic-breathe 1.6s var(--ease) infinite;
        }

        .mic-btn.processing {
            background: var(--fill-active);
            color: var(--text-2);
        }

        .mic-btn.processing svg {
            animation: mic-fade 1.1s ease-in-out infinite;
        }

        @keyframes mic-breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.07); }
        }

        @keyframes mic-fade {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }

        /* Send button — only present while dictated text awaits review */
        .send-btn {
            display: none;
        }

        .send-btn.visible {
            display: flex;
        }
    </style>
</head>
<body>
    <!-- Visually hidden accessibility title -->
    <h1 class="sr-only">Mac Remote Controller and Air Mouse</h1>

    <!-- Full-screen Touch Surface -->
    <!-- Everything lives inside #scene, which is sized and offset to match
         the VISUAL viewport. iOS scrolls the visual viewport when the
         keyboard opens and position:fixed anchors to the LAYOUT viewport,
         so without this the whole UI slides off the top. -->
    <div id="scene">
        <canvas id="bg-canvas"></canvas>
        <div id="ambient-glow"></div>
            <div id="touch-surface"></div>

        <!-- Hidden iOS Haptic checkbox (iOS 18+ switch trick for haptic feedback) -->
        <input type="checkbox" id="haptic-switch" switch style="position:absolute;top:-999px;left:-999px;opacity:0;pointer-events:none;" aria-hidden="true">

        <!-- Bottom input bar: text field fills, mic sits to its right -->
        <div id="context-pills" class="context-pills">
            <button id="pill-copy" class="context-pill" aria-label="Copy selection">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>Copy
            </button>
            <button id="pill-paste" class="context-pill" aria-label="Paste">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>Paste
            </button>
        </div>

        <div id="input-bar" class="input-bar">
            <!-- Config — two hairlines, opens every setting -->
            <button id="btn-config" class="bar-btn config-btn" aria-label="Settings" title="Settings">
                <span></span><span></span>
            </button>

            <input type="text" id="text-input" class="text-input" placeholder="Type to your Mac"
                   autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
                   enterkeyhint="send" aria-label="Send text to Mac">

            <!-- Send — only shown while dictated text is awaiting review -->
            <button id="btn-send" class="bar-btn send-btn" aria-label="Send text" title="Send">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>

            <!-- Mic — hold to speak; transcript lands in the field for review -->
            <button id="btn-mic" class="bar-btn mic-btn" aria-label="Hold to dictate" title="Hold to dictate">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
        </div>

        <!-- Settings sheet -->
        <div id="sheet-scrim" class="sheet-scrim">
            <div class="sheet" id="settings-sheet">
                <div class="sheet-grabber"></div>

                <div class="group-title">Mode</div>
                <div class="group">
                    <div class="row">
                        <span class="row-label">Input</span>
                        <div class="segmented">
                            <button id="seg-trackpad" class="segment active">Trackpad</button>
                            <button id="seg-airmouse" class="segment">Air Mouse</button>
                        </div>
                    </div>
                </div>

                <div class="group-title">Pointer</div>
                <div class="group">
                    <div class="row">
                        <span class="row-label">Sensitivity</span>
                        <input type="range" class="slider" id="slider-gyro-sensitivity" min="1" max="100" value="27">
                    </div>
                    <div class="row">
                        <span class="row-label">Invert scroll</span>
                        <input type="checkbox" id="checkbox-invert-scroll" style="width:22px;height:22px;">
                    </div>
                </div>

                <div class="group-title">Shortcuts</div>
                <div class="group">
                    <div class="chips">
                        <button class="chip shortcut-btn" data-code="c" data-mods="cmd">⌘C</button>
                        <button class="chip shortcut-btn" data-code="v" data-mods="cmd">⌘V</button>
                        <button class="chip shortcut-btn" data-code="x" data-mods="cmd">⌘X</button>
                        <button class="chip shortcut-btn" data-code="z" data-mods="cmd">⌘Z</button>
                        <button class="chip shortcut-btn" data-code="a" data-mods="cmd">⌘A</button>
                        <button class="chip shortcut-btn" data-code="tab" data-mods="cmd">⌘Tab</button>
                        <button class="chip shortcut-btn" data-code="space" data-mods="cmd">⌘Space</button>
                        <button class="chip shortcut-btn" data-code="q" data-mods="cmd">⌘Q</button>
                    </div>
                </div>

                <button class="sheet-action" id="btn-calibrate-gyro">Calibrate air mouse</button>
                <button class="sheet-action prominent" id="btn-close-settings">Done</button>
            </div>
        </div>
        <!-- Pairing PIN Overlay -->
        <div class="pairing-overlay" id="pairing-overlay">
            <div class="pairing-content">
                <h4>Enter Pairing PIN</h4>
                <p>Shown in the Mac's terminal window</p>
                <input type="text" id="pairing-pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000">
                <button class="sheet-action prominent" id="btn-pairing-submit" style="margin-top:16px;">Pair</button>
                <div id="pairing-error"></div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast-view">Notification</div>
    </div>

    <script>
        // WS State
        let ws = null;
        let isConnected = false;
        let authenticated = false;
        let sessionToken = localStorage.getItem('session-token');

        // Pairing UI
        const pairingOverlay = document.getElementById('pairing-overlay');
        const pairingPinInput = document.getElementById('pairing-pin-input');
        const btnPairingSubmit = document.getElementById('btn-pairing-submit');
        const pairingError = document.getElementById('pairing-error');

        // UI Selectors
        const touchSurface = document.getElementById('touch-surface');
        const btnConfig = document.getElementById('btn-config');
        const sheetScrim = document.getElementById('sheet-scrim');
        const settingsSheet = document.getElementById('settings-sheet');
        const segTrackpad = document.getElementById('seg-trackpad');
        const segAirmouse = document.getElementById('seg-airmouse');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        const btnCalibrateGyro = document.getElementById('btn-calibrate-gyro');
        const sliderGyroSensitivity = document.getElementById('slider-gyro-sensitivity');
        const checkboxInvertScroll = document.getElementById('checkbox-invert-scroll');
        const inputBar = document.getElementById('input-bar');
        const textInput = document.getElementById('text-input');
        const btnMic = document.getElementById('btn-mic');
        const btnSend = document.getElementById('btn-send');
        const pillCopy = document.getElementById('pill-copy');
        const pillPaste = document.getElementById('pill-paste');
        const toastView = document.getElementById('toast-view');

        // Connection state. Drives the global red tint and the centre ripple
        // pulse in the dot grid — that IS the status indicator now.
        let isOffline = true;
        let keyboardOpen = false;   // drives the blue wash behind the input

        // Success feedback: a single coloured pulse through the dot grid,
        // in place of a toast. Queued here and picked up by the render loop.
        let pendingPulse = null;
        const PULSE_SUCCESS = [52, 199, 89];   // system green

        function pulseGrid(rgb) {
            pendingPulse = rgb;
        }

        function setOnline(online) {
            isOffline = !online;
            document.body.classList.toggle('offline', isOffline);
            if (isOffline && typeof setContext === 'function') setContext(false, false);
        }

        setOnline(false);   // start in the disconnected state until the socket opens
        // Keyboard geometry readout, for diagnosing device-specific layout:
        // load the page with ?debug appended.
        if (location.search.includes('debug')) document.body.classList.add('debug');

        // Mode state
        let currentMode = 'trackpad'; // 'trackpad' or 'airmouse'
        let gyroEnabled = false;
        let airMouseActive = false;
        let localGyro = {x: 0, y: 0, z: 0};
        
        let lastAlpha = null;
        let lastBeta = null;
        let lastGamma = null;
        let lastOrientationTime = null;

        // Touch tracking variables
        let lastX = 0;
        let lastY = 0;
        let lastTouchTime = 0;
        let isMoving = false;
        let dragModeActivated = false;
        // Double-tap and hold picks up without having to move first. Holding is the
        // natural way to grab something, and requiring a 6px move meant a deliberate
        // press-and-hold did nothing at all.
        let dragHoldTimer = null;
        const DRAG_HOLD_MS = 140;
        // Touch and hold → right click. Holding still previously did nothing in
        // trackpad mode, so this gesture was free; the two-finger tap stays.
        const LONG_PRESS_MS = 500;
        const LONG_PRESS_SLOP = 10;   // px of drift that cancels it
        let longPressTimer = null;
        let longPressFired = false;
        let dragDownSent = false;
        let wasLastTouchTap = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTimestamp = 0;
        let touchStartPageX = 0;
        let touchStartPageY = 0;
        let lastScrollX = 0;
        let lastScrollY = 0;
        let scrollThreshold = 8; // Pixels to distinguish tap/hold vs scroll
        let airMouseTouchTimer = null;
        let isAirMouseDragging = false;
        let isAirMouseScrolling = false;
        let isScrolling = false;
        let isEdgeScrolling = false;
        let isLeftEdgeGesture = false;
        let isRightEdgeGesture = false;
        let edgeScrollDirection = null;
        let airmouseTouchCount = 0;
        // The keyboard is opened by an explicit double-tap (see touchend), never by
        // arming a flag that swallows whatever the user touches next. That older
        // approach raced the network: the server's focus_keyboard lands ~210ms after
        // the first tap, usually *after* the second tap of a double-tap has already
        // begun, so the double-tap did nothing and the arming instead fired on some
        // later, unrelated touch — the keyboard appearing while moving the cursor.

        // Scroll smoothing state (exponential moving average on velocity)
        let scrollVelX = 0;
        let scrollVelY = 0;
        const SCROLL_SMOOTH = 0.55; // EMA alpha: higher = more responsive, lower = smoother

        // Momentum ("flick") scrolling — decays the last scroll velocity after
        // release instead of stopping dead, using the same velocity EMA above.
        let momentumRAF = null;
        const MOMENTUM_FRICTION = 0.93; // per-frame decay
        const MOMENTUM_MIN_VELOCITY = 1.2; // px/frame — below this, don't bother

        function cancelMomentumScroll() {
            if (momentumRAF) {
                cancelAnimationFrame(momentumRAF);
                momentumRAF = null;
            }
        }

        function startMomentumScroll(vx, vy) {
            cancelMomentumScroll();
            if (Math.abs(vx) < MOMENTUM_MIN_VELOCITY && Math.abs(vy) < MOMENTUM_MIN_VELOCITY) return;
            let velX = vx, velY = vy;
            function step() {
                velX *= MOMENTUM_FRICTION;
                velY *= MOMENTUM_FRICTION;
                if (Math.abs(velX) < 0.1 && Math.abs(velY) < 0.1) {
                    momentumRAF = null;
                    return;
                }
                sendScroll(
                    Math.sign(velX) * scrollFactor(Math.abs(velX)) * 0.35,
                    Math.sign(velY) * scrollFactor(Math.abs(velY)) * 0.35
                );
                momentumRAF = requestAnimationFrame(step);
            }
            momentumRAF = requestAnimationFrame(step);
        }

        // Shared scroll speed → multiplier curve:
        //   0–1.5 px/frame  → dampen (0.25× at zero, ramping to 1.0×)
        //   1.5–3 px/frame  → neutral (1.0×)
        //   3+ px/frame     → gentle acceleration
        function scrollFactor(speed) {
            if (speed < 1.5) {
                return 0.25 + (speed / 1.5) * 0.75; // 0.25 → 1.0 over the slow zone
            } else if (speed > 3) {
                return 1.0 + Math.pow(speed - 3, 1.05) * 0.10; // soft expo above 3px
            }
            return 1.0;
        }

        // Load settings from localStorage
        const savedSensitivity = localStorage.getItem('gyro-sensitivity');
        if (savedSensitivity !== null) {
            sliderGyroSensitivity.value = savedSensitivity;
        }
        const savedInvertScroll = localStorage.getItem('invert-scroll');
        if (savedInvertScroll !== null) {
            checkboxInvertScroll.checked = savedInvertScroll === 'true';
        }

        // Save settings to localStorage on change
        sliderGyroSensitivity.addEventListener('input', () => {
            localStorage.setItem('gyro-sensitivity', sliderGyroSensitivity.value);
        });
        checkboxInvertScroll.addEventListener('change', () => {
            localStorage.setItem('invert-scroll', checkboxInvertScroll.checked);
        });

        // Mode switching — now lives in the settings sheet, not on-screen chrome
        function setMode(mode) {
            currentMode = mode;
            segTrackpad.classList.toggle('active', mode === 'trackpad');
            segAirmouse.classList.toggle('active', mode === 'airmouse');
            vibrate(15);
            if (mode === 'airmouse') checkSensorPermissions();
            updateAirMouseState();
            // Never leave a button held down across a mode change.
            sendPacket({type: 'click', button: 'left', action: 'up'});
            sendPacket({type: 'click', button: 'right', action: 'up'});
        }

        segTrackpad.addEventListener('click', (e) => { e.stopPropagation(); setMode('trackpad'); });
        segAirmouse.addEventListener('click', (e) => { e.stopPropagation(); setMode('airmouse'); });

        // Settings sheet
        function openSheet() {
            sheetScrim.classList.add('active');
            vibrate(15);
        }
        function closeSheet() {
            sheetScrim.classList.remove('active');
            vibrate(15);
        }

        btnConfig.addEventListener('click', (e) => { e.stopPropagation(); openSheet(); });
        btnCloseSettings.addEventListener('click', (e) => { e.stopPropagation(); closeSheet(); });
        // Tap the scrim (but not the sheet itself) to dismiss
        sheetScrim.addEventListener('click', (e) => {
            if (e.target === sheetScrim) closeSheet();
        });

        // Haptic feedback helper — uses iOS 18 checkbox-switch trick as fallback for iOS Safari
        const hapticSwitch = document.getElementById('haptic-switch');
        let hapticLastTime = 0;
        function cancelLongPress() {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }

        function vibrate(duration) {
            if (navigator.vibrate) {
                // Standard Vibration API (Android/Chrome)
                navigator.vibrate(duration);
            } else if (hapticSwitch) {
                // iOS 18+ haptic: rapidly toggling a switch-style checkbox triggers system haptic
                const now = Date.now();
                const minInterval = Array.isArray(duration) ? 50 : Math.max(30, duration);
                if (now - hapticLastTime < minInterval) return;
                hapticLastTime = now;
                hapticSwitch.checked = !hapticSwitch.checked;
                // For patterns, fire multiple toggles
                if (Array.isArray(duration) && duration.length > 1) {
                    let delay = duration[0];
                    for (let i = 1; i < Math.min(duration.length, 6); i++) {
                        setTimeout(() => { hapticSwitch.checked = !hapticSwitch.checked; }, delay);
                        delay += duration[i];
                    }
                }
            }
        }

        // Display notifications
        let toastTimeout;
        function showToast(msg) {
            clearTimeout(toastTimeout);
            toastView.textContent = msg;
            toastView.classList.add('show');
            toastTimeout = setTimeout(() => {
                toastView.classList.remove('show');
            }, 2000);
        }

        // Setup Secure WebSocket connection
        function connectWS() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const url = `${proto}//${host}`;
            
            ws = new WebSocket(url);
            
            ws.onopen = () => {
                setOnline(true);
                pulseGrid(PULSE_SUCCESS);
                vibrate([40, 40, 40]);
                authenticated = false;
                if (sessionToken) {
                    sendRaw({type: 'auth', token: sessionToken});
                } else {
                    showPairingOverlay();
                }
            };

            ws.onclose = () => {
                setOnline(false);
                authenticated = false;
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (e) => {
                console.error("WS error: ", e);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'context') {
                        setContext(msg.hasSelection, msg.hasClipboard);
                    } else if (msg.type === 'focus_state') {
                        macFieldFocused = !!msg.focused;
                        updateSendButton();
                    } else if (msg.type === 'focus_keyboard') {
                        // iOS Safari blocks focus() from WS handlers (not a user gesture),
                        // so this can only ever be a hint. It means "a Mac text field just
                        // took focus"; double-tapping the surface is what actually opens
                        // the keyboard, inside a real touch event.
                        macFieldFocused = true;
                        updateSendButton();
                        vibrate(15);
                    } else if (msg.type === 'auth_ok') {
                        authenticated = true;
                        sessionToken = msg.token;
                        localStorage.setItem('session-token', sessionToken);
                        hidePairingOverlay();
                        pulseGrid(PULSE_SUCCESS);
                        vibrate(20);
                    } else if (msg.type === 'auth_fail') {
                        authenticated = false;
                        if (msg.reason === 'rate_limited') {
                            pairingError.textContent = 'Too many attempts. Wait a bit and try again.';
                        } else {
                            localStorage.removeItem('session-token');
                            sessionToken = null;
                            pairingError.textContent = 'Incorrect PIN. Check the Mac terminal and try again.';
                        }
                        showPairingOverlay();
                    }
                } catch (e) {}
            };
        }

        function showPairingOverlay() {
            pairingOverlay.classList.add('active');
            setTimeout(() => pairingPinInput.focus(), 100);
        }

        function hidePairingOverlay() {
            pairingOverlay.classList.remove('active');
            pairingPinInput.value = '';
            pairingError.textContent = '';
        }

        btnPairingSubmit.addEventListener('click', () => {
            const pin = pairingPinInput.value.trim();
            if (pin.length < 4) {
                pairingError.textContent = 'Enter the PIN shown on the Mac.';
                return;
            }
            pairingError.textContent = '';
            sendRaw({type: 'auth', pin: pin});
        });
        pairingPinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btnPairingSubmit.click();
        });

        // Send a packet regardless of pairing state — used only for the auth handshake itself
        function sendRaw(obj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(obj));
            }
        }

        // Send packet safely — control messages are dropped until the Mac has confirmed pairing
        function sendPacket(obj) {
            if (!authenticated) return;
            sendRaw(obj);
        }

        // Send scroll event with customizable inversion
        function sendScroll(dx, dy) {
            const invert = checkboxInvertScroll ? checkboxInvertScroll.checked : false;
            const mult = invert ? 1 : -1;
            sendPacket({
                type: 'scroll',
                dx: dx * mult,
                dy: dy * mult
            });
        }

        // Unified Touch Surface Gestures
        touchSurface.addEventListener('touchstart', (e) => {
            const touches = e.touches;
            const now = Date.now();
            cancelMomentumScroll();

            // If a text-field focus was signaled by the server, open keyboard on next touch.
            // Must NOT call e.preventDefault() here — iOS Safari won't open the keyboard
            // if the default touch behavior is cancelled before focus() fires.
            e.preventDefault();

            if (currentMode === 'trackpad') {
                if (touches.length === 1) {
                    const touch = touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    lastX = touch.clientX;
                    lastY = touch.clientY;
                    touchStartTimestamp = now;
                    isEdgeScrolling = false;
                    
                    const rect = touchSurface.getBoundingClientRect();
                    const touchXRel = touch.clientX - rect.left;
                    const touchYRel = touch.clientY - rect.top;
                    // Left edge (leftmost 15%) → desktop switch gesture
                    // Note: 15% avoids iOS system Back gesture interception at pixel-0
                    if (touchXRel < rect.width * 0.15) {
                        isLeftEdgeGesture = true;
                        isMoving = false;
                        vibrate(8);
                    // Right edge (rightmost 10%) → vertical scroll strip
                    } else if (touchXRel > rect.width * 0.90) {
                        isEdgeScrolling = true;
                        edgeScrollDirection = 'vertical';
                        lastScrollY = touch.clientY;
                        scrollVelY = 0;
                        isMoving = false;
                        vibrate(10);
                    // Bottom edge (bottom 10%) → horizontal scroll
                    } else if (touchYRel > rect.height * 0.90) {
                        isEdgeScrolling = true;
                        edgeScrollDirection = 'horizontal';
                        lastScrollX = touch.clientX;
                        scrollVelX = 0;
                        isMoving = false;
                        vibrate(10);
                    } else {
                        isMoving = true;

                        // Double tap to drag detection: only if previous touch was a quick tap and within 300ms
                        if (wasLastTouchTap && (now - lastTouchTime < 300)) {
                            dragModeActivated = true;
                            dragDownSent = false;
                            // Hold after the second tap to pick up, without needing to move.
                            clearTimeout(dragHoldTimer);
                            dragHoldTimer = setTimeout(() => {
                                dragHoldTimer = null;
                                if (dragModeActivated && !dragDownSent) {
                                    sendPacket({type: 'click', button: 'left', action: 'down'});
                                    dragDownSent = true;
                                    vibrate(15);
                                }
                            }, DRAG_HOLD_MS);
                        }

                        // Hold still to right click — but not when this touch is
                        // starting a drag, where holding is how you pick up.
                        longPressFired = false;
                        cancelLongPress();
                        if (!dragModeActivated) {
                            longPressTimer = setTimeout(() => {
                                longPressFired = true;
                                longPressTimer = null;
                                sendPacket({type: 'click', button: 'right', action: 'tap'});
                                vibrate([25, 35]);
                            }, LONG_PRESS_MS);
                        }
                    }
                } else if (touches.length === 2) {
                    cancelLongPress();
                    isScrolling = true;
                    isMoving = false;
                    lastScrollY = (touches[0].clientY + touches[1].clientY) / 2;
                    lastScrollX = (touches[0].clientX + touches[1].clientX) / 2;
                }
            } else if (currentMode === 'airmouse') {
                airmouseTouchCount = Math.max(airmouseTouchCount, touches.length);
                if (touches.length === 1) {
                    const touch = touches[0];
                    touchStartTimestamp = now;
                    touchStartPageX = touch.pageX;
                    touchStartPageY = touch.pageY;
                    lastScrollX = touch.pageX;
                    lastScrollY = touch.pageY;
                    isAirMouseDragging = false;
                    isAirMouseScrolling = false;

                    // Start timer for touch-and-hold left-mouse-down drag
                    clearTimeout(airMouseTouchTimer);
                    airMouseTouchTimer = setTimeout(() => {
                        if (!isAirMouseScrolling) {
                            isAirMouseDragging = true;
                            vibrate(30);
                            sendPacket({type: 'click', button: 'left', action: 'down'});
                        }
                    }, 220);
                } else {
                    clearTimeout(airMouseTouchTimer);
                }
            }
        }, { passive: false });

        touchSurface.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touches = e.touches;

            if (currentMode === 'trackpad') {
                if (touches.length === 1) {
                    const touch = touches[0];
                    if (isEdgeScrolling) {
                        if (edgeScrollDirection === 'vertical') {
                            const rawDY = touch.clientY - lastScrollY;
                            lastScrollY = touch.clientY;
                            if (Math.abs(rawDY) > 0.3) {
                                scrollVelY = SCROLL_SMOOTH * rawDY + (1 - SCROLL_SMOOTH) * scrollVelY;
                                const speed = Math.abs(scrollVelY);
                                const out = Math.sign(scrollVelY) * scrollFactor(speed) * 0.40;
                                sendScroll(0, out);
                                if (speed > 5) vibrate(4);
                            }
                        } else if (edgeScrollDirection === 'horizontal') {
                            const rawDX = touch.clientX - lastScrollX;
                            lastScrollX = touch.clientX;
                            if (Math.abs(rawDX) > 0.3) {
                                scrollVelX = SCROLL_SMOOTH * rawDX + (1 - SCROLL_SMOOTH) * scrollVelX;
                                const speed = Math.abs(scrollVelX);
                                const out = Math.sign(scrollVelX) * scrollFactor(speed) * 0.40;
                                sendScroll(out, 0);
                                if (speed > 5) vibrate(4);
                            }
                        }
                    } else if (isMoving) {
                        if (longPressTimer) {
                            const drift = Math.hypot(touch.clientX - touchStartX,
                                                     touch.clientY - touchStartY);
                            if (drift > LONG_PRESS_SLOP) cancelLongPress();
                        }

                        if (dragModeActivated && !dragDownSent) {
                            const dist = Math.sqrt((touch.clientX - touchStartX) ** 2 + (touch.clientY - touchStartY) ** 2);
                            if (dist > 6) {
                                sendPacket({type: 'click', button: 'left', action: 'down'});
                                dragDownSent = true;
                                vibrate(30);
                            }
                        }

                        // Only track movements if we are not in dragModeActivated or if we have already sent the drag-down
                        if (!dragModeActivated || dragDownSent) {
                            const dx = touch.clientX - lastX;
                            const dy = touch.clientY - lastY;
                            lastX = touch.clientX;
                            lastY = touch.clientY;


                            const speed = Math.sqrt(dx * dx + dy * dy);
                            const baseSensitivity = 1.3;
                            // Smooth acceleration starting at 2px/frame:
                            // Below 2px → gentle precision dampen; above 2px → progressive expo boost with a flatter exponent.
                            let factor;
                            if (speed < 2) {
                                factor = 0.45 + (speed / 2) * 0.55; // ramps 0.45 → 1.0 over 0–2px
                            } else {
                                factor = 1.0 + Math.pow(speed - 2, 1.1) * 0.10; // gentler exponent, shallower coefficient
                            }

                            sendPacket({
                                type: 'trackpad',
                                dx: dx * baseSensitivity * factor,
                                dy: dy * baseSensitivity * factor
                            });
                        } else {
                            // Still update lastX/lastY to follow the finger to avoid jumping when drag activates
                            lastX = touch.clientX;
                            lastY = touch.clientY;
                        }
                    }
                } else if (touches.length === 2 && isScrolling) {
                    const currentScrollY = (touches[0].clientY + touches[1].clientY) / 2;
                    const currentScrollX = (touches[0].clientX + touches[1].clientX) / 2;
                    const rawDY = currentScrollY - lastScrollY;
                    const rawDX = currentScrollX - lastScrollX;
                    lastScrollY = currentScrollY;
                    lastScrollX = currentScrollX;

                    if (Math.abs(rawDY) > 0.3 || Math.abs(rawDX) > 0.3) {
                        // Smooth + accelerate two-finger scroll
                        scrollVelY = SCROLL_SMOOTH * rawDY + (1 - SCROLL_SMOOTH) * scrollVelY;
                        scrollVelX = SCROLL_SMOOTH * rawDX + (1 - SCROLL_SMOOTH) * scrollVelX;
                        const speedY = Math.abs(scrollVelY);
                        const speedX = Math.abs(scrollVelX);
                        sendScroll(
                            Math.sign(scrollVelX) * scrollFactor(speedX) * 0.35,
                            Math.sign(scrollVelY) * scrollFactor(speedY) * 0.35
                        );
                        if (speedY > 6 || speedX > 6) vibrate(3);
                    }
                }
            } else if (currentMode === 'airmouse') {
                if (touches.length === 1) {
                    const touch = touches[0];
                    const distX = touch.pageX - touchStartPageX;
                    const distY = touch.pageY - touchStartPageY;

                    if (!isAirMouseDragging && !isAirMouseScrolling && (Math.abs(distX) > scrollThreshold || Math.abs(distY) > scrollThreshold)) {
                        clearTimeout(airMouseTouchTimer);
                        isAirMouseScrolling = true;
                    }

                    if (isAirMouseScrolling) {
                        const deltaY = touch.pageY - lastScrollY;
                        const deltaX = touch.pageX - lastScrollX;
                        lastScrollY = touch.pageY;
                        lastScrollX = touch.pageX;

                        if (Math.abs(deltaY) > 0.5 || Math.abs(deltaX) > 0.5) {
                            sendScroll(deltaX * 0.65, deltaY * 0.65);
                        }
                    }
                }
            }
        }, { passive: false });

        touchSurface.addEventListener('touchend', (e) => {
            e.preventDefault();
            const now = Date.now();

            if (currentMode === 'trackpad') {

                // Calculate distance moved to verify if it's a tap or a drag
                let dist = 0;
                if (e.changedTouches && e.changedTouches[0]) {
                    const t = e.changedTouches[0];
                    const dx = t.clientX - touchStartX;
                    const dy = t.clientY - touchStartY;
                    dist = Math.sqrt(dx * dx + dy * dy);
                }

                cancelLongPress();
                clearTimeout(dragHoldTimer);
                dragHoldTimer = null;

                if (dragModeActivated) {
                    if (dragDownSent) {
                        sendPacket({type: 'click', button: 'left', action: 'up'});
                        vibrate(10);
                    } else {
                        sendPacket({type: 'click', button: 'left', action: 'double_tap'});
                        vibrate([20, 20]);
                        // Double-tap on a Mac text field opens the keyboard. touchend is a
                        // real user gesture, so iOS allows focus() here — unlike from the
                        // WebSocket handler. macFieldFocused comes from focus_state after
                        // the first tap, and is only a hint: if it never arrives the
                        // keyboard simply doesn't open, and nothing else is affected
                        // (ADR-0004 — this must never gate input).
                        if (macFieldFocused) {
                            textInput.focus();
                        }
                    }
                    dragModeActivated = false;
                    dragDownSent = false;
                    wasLastTouchTap = false;
                } else if (!longPressFired && isMoving && !isEdgeScrolling && (now - touchStartTimestamp < 220) && dist < 12) {
                    sendPacket({type: 'click', button: 'left', action: 'tap'});
                    vibrate(20);
                    wasLastTouchTap = true;
                } else {
                    wasLastTouchTap = false;
                }

                if (e.changedTouches.length === 2 || (isScrolling && e.touches.length === 0)) {
                    if (now - touchStartTimestamp < 250) {
                        sendPacket({type: 'click', button: 'right', action: 'tap'});
                        vibrate(25);
                    }
                }

                if (isLeftEdgeGesture && e.changedTouches && e.changedTouches[0]) {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    if (Math.abs(dx) > 40) {
                        sendPacket({type: 'switch_desktop', direction: 'left'});
                        vibrate([20, 15]);
                    }
                    isLeftEdgeGesture = false;
                }

                if (isRightEdgeGesture && e.changedTouches && e.changedTouches[0]) {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    if (Math.abs(dx) > 40) {
                        sendPacket({type: 'switch_desktop', direction: 'right'});
                        vibrate([20, 15]);
                    }
                    isRightEdgeGesture = false;
                }

                // Hand off remaining scroll velocity to momentum before clearing it
                if (isScrolling || isEdgeScrolling) {
                    startMomentumScroll(scrollVelX, scrollVelY);
                }

                isMoving = false;
                isScrolling = false;
                isEdgeScrolling = false;
                isLeftEdgeGesture = false;
                isRightEdgeGesture = false;
                // Reset scroll velocity so stale momentum state never bleeds into the next gesture
                scrollVelX = 0;
                scrollVelY = 0;
                lastTouchTime = now;
            } else if (currentMode === 'airmouse') {
                clearTimeout(airMouseTouchTimer);

                if (isAirMouseDragging) {
                    sendPacket({type: 'click', button: 'left', action: 'up'});
                    vibrate(10);
                } else if (!isAirMouseScrolling) {
                    if (airmouseTouchCount === 1 && (now - touchStartTimestamp < 220)) {
                        sendPacket({type: 'click', button: 'left', action: 'tap'});
                        vibrate(20);
                    } else if (airmouseTouchCount === 2 && (now - touchStartTimestamp < 250)) {
                        sendPacket({type: 'click', button: 'right', action: 'tap'});
                        vibrate(25);
                    }
                }
                isAirMouseDragging = false;
                isAirMouseScrolling = false;
                airmouseTouchCount = 0;
            }
        }, { passive: false });

        // iOS cancels touches on interruption — the keyboard animating in, a system
        // edge swipe, a notification, an incoming call. touchend never fires in that
        // case, so without this the 'up' matching a drag's 'down' is never sent and the
        // Mac is left with the button held down, dragging everything the cursor touches
        // (ADR-0006). Releases the button and resets gesture state to match the server.
        touchSurface.addEventListener('touchcancel', () => {
            clearTimeout(dragHoldTimer);
            dragHoldTimer = null;
            cancelLongPress();

            if (dragDownSent || isAirMouseDragging) {
                sendPacket({type: 'click', button: 'left', action: 'up'});
            }

            dragModeActivated = false;
            dragDownSent = false;
            wasLastTouchTap = false;
            isMoving = false;
            isScrolling = false;
            isEdgeScrolling = false;
            isLeftEdgeGesture = false;
            isRightEdgeGesture = false;
            isAirMouseDragging = false;
            isAirMouseScrolling = false;
            airmouseTouchCount = 0;
            scrollVelX = 0;
            scrollVelY = 0;
        }, { passive: false });

        // Same reasoning for backgrounding the page mid-drag: no touch event is
        // delivered at all, so release explicitly rather than leaving it held.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'hidden') return;
            clearTimeout(dragHoldTimer);
            dragHoldTimer = null;
            if (dragDownSent || isAirMouseDragging) {
                sendPacket({type: 'click', button: 'left', action: 'up'});
            }
            dragModeActivated = false;
            dragDownSent = false;
            isAirMouseDragging = false;
        });

        // Keyboard shortcuts (Cmd+C, Cmd+Tab, etc.)
        document.querySelectorAll('.shortcut-btn').forEach((btn) => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                sendPacket({type: 'key', code: btn.dataset.code, modifiers: btn.dataset.mods.split(',')});
                vibrate(15);
                pulseGrid(PULSE_SUCCESS);
            });
        });

        // ── Text input ───────────────────────────────────────────────────
        // Always live passthrough: every character, backspace and delete goes
        // to the Mac as you type. The field keeps what you typed rather than
        // clearing itself, so nothing is ever silently lost — if the Mac had no
        // field focused, the text is still here and Send re-types it.
        // Dictation is the exception: a transcript is held for review first.
        let sentValue = '';           // what the Mac has already received
        let holding = false;          // field holds text the Mac has not seen
        let macFieldFocused = false;  // hint only — never gates sending

        function setHolding(on) {
            holding = on;
            updateSendButton();
        }

        function updateSendButton() {
            // Send is offered whenever there is text that could be (re)typed.
            btnSend.classList.toggle('visible', textInput.value.length > 0);
            // Subtle hint that the Mac has nowhere to put the keystrokes.
            textInput.classList.toggle('pending', holding || !macFieldFocused);
        }

        // Type the whole field on the Mac now, then clear it.
        function commitField() {
            const text = textInput.value;
            if (!text) return;
            sendPacket({type: 'keyboard', text: text});
            textInput.value = '';
            sentValue = '';
            setHolding(false);
            vibrate(15);
        }

        textInput.addEventListener('input', () => {
            if (holding) { updateSendButton(); return; }   // awaiting review

            const val = textInput.value;
            if (val === sentValue) return;

            // Length of the prefix the Mac and the field still agree on.
            let i = 0;
            const max = Math.min(val.length, sentValue.length);
            while (i < max && val[i] === sentValue[i]) i++;

            // Backspace whatever diverged, then type the new tail. This is what
            // makes delete work: shortening the field sends real backspaces.
            for (let n = 0; n < sentValue.length - i; n++) {
                sendPacket({type: 'key', code: 'backspace'});
            }
            const tail = val.slice(i);
            if (tail) sendPacket({type: 'keyboard', text: tail});

            sentValue = val;
            updateSendButton();
        });

        textInput.addEventListener('keydown', (e) => {
            // Backspace and space deliberately fall through: the field edits
            // itself and the 'input' diff above forwards the change, so the two
            // stay in sync without double-sending.
            const key = e.key;
            if (key === 'Backspace') {
                // Nothing to the left locally: forward it so it deletes text
                // that was already in the Mac's field.
                if (textInput.selectionStart === 0 && textInput.selectionEnd === 0) {
                    e.preventDefault();
                    sendPacket({type: 'key', code: 'backspace'});
                    vibrate(10);
                }
                // Otherwise fall through: the field shortens and the input
                // diff above turns that into backspaces.
            } else if (key === 'Enter') {
                e.preventDefault();
                if (holding) {
                    commitField();          // commit the dictated text
                } else {
                    sendPacket({type: 'key', code: 'enter'});
                    textInput.value = '';   // line committed on the Mac
                    sentValue = '';
                    updateSendButton();
                    vibrate(15);
                }
            } else if (key === 'Escape') {
                e.preventDefault();
                sendPacket({type: 'key', code: 'escape'});
            } else if (key === 'Tab') {
                e.preventDefault();
                sendPacket({type: 'key', code: 'tab'});
            }
        });

        // Blur no longer discards anything — text stays until it is sent.
        textInput.addEventListener('blur', updateSendButton);

        btnSend.addEventListener('click', (e) => {
            e.stopPropagation();
            commitField();
        });

        // ── Contextual copy / paste ──────────────────────────────────────
        // The server reports what the focused Mac element is doing after any
        // gesture that could change it. Unknown is treated as "nothing there",
        // so a pill never offers an action that would do nothing.
        // FLIP: note where the visible pills sit, apply the change, then
        // spring them back from their old position — so a pill appearing pushes
        // its neighbour aside smoothly instead of teleporting it.
        // offsetLeft is used rather than getBoundingClientRect because it
        // reports layout position only, unaffected by a transform that an
        // in-flight animation may still be applying.
        function flipPills(mutate) {
            const pills = [pillCopy, pillPaste];
            const before = new Map();
            for (const el of pills) {
                if (el.dataset.shown === '1') before.set(el, el.offsetLeft);
            }

            mutate();

            for (const [el, prevLeft] of before) {
                if (el.dataset.shown !== '1') continue;   // on its way out
                const dx = prevLeft - el.offsetLeft;
                if (Math.abs(dx) < 0.5) continue;
                Motion.animate(el, { x: [dx, 0] },
                    { type: 'spring', visualDuration: 0.34, bounce: 0.18 });
            }
        }

        // Springs rather than eased curves: the pills should settle the way
        // iOS controls do. Guarded so a repeat call doesn't restart a spring
        // that is already running.
        function showPill(el, delay = 0) {
            if (el.dataset.shown === '1') return;
            el.dataset.shown = '1';
            el.style.display = 'flex';
            Motion.animate(el,
                { opacity: [0, 1], y: [14, 0], scale: [0.88, 1] },
                { type: 'spring', visualDuration: 0.38, bounce: 0.34, delay }
            );
        }

        function hidePill(el) {
            if (el.dataset.shown !== '1') return;
            el.dataset.shown = '0';
            Motion.animate(el,
                { opacity: 0, y: 10, scale: 0.94 },
                { duration: 0.16, ease: [0.4, 0, 1, 1] }
            ).finished.then(() => {
                // Only hide if nothing re-showed it while we were animating out.
                if (el.dataset.shown === '0') {
                    flipPills(() => { el.style.display = 'none'; });
                }
            });
        }

        function setContext(hasSelection, hasClipboard) {
            flipPills(() => {
                // Stagger the second pill slightly when both arrive together.
                if (hasSelection) showPill(pillCopy); else hidePill(pillCopy);
                if (hasClipboard) showPill(pillPaste, hasSelection ? 0.05 : 0);
                else hidePill(pillPaste);
            });
        }

        pillCopy.addEventListener('click', (e) => {
            e.stopPropagation();
            sendPacket({type: 'key', code: 'c', modifiers: ['cmd']});
            vibrate(15);
            // Paste becomes available immediately; the server confirms shortly.
            flipPills(() => showPill(pillPaste));
        });

        pillPaste.addEventListener('click', (e) => {
            e.stopPropagation();
            sendPacket({type: 'key', code: 'v', modifiers: ['cmd']});
            vibrate(15);
        });

        // Air Mouse Controls
        function checkSensorPermissions() {
            if (typeof DeviceOrientationEvent !== 'undefined' && 
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            pulseGrid(PULSE_SUCCESS);
                            enableSensors();
                            updateAirMouseState();
                        } else {
                            showToast('Permission denied');
                        }
                    })
                    .catch(err => {
                        console.error("Permission error: ", err);
                        showToast('Failed to acquire permissions');
                    });
            } else {
                enableSensors();
                updateAirMouseState();
            }
        }

        function enableSensors() {
            if (gyroEnabled) return;
            
            window.addEventListener('deviceorientation', (e) => {
                const alpha = e.alpha || 0;
                const beta = e.beta || 0;
                const gamma = e.gamma || 0;
                
                const now = performance.now();
                if (lastOrientationTime && lastAlpha !== null) {
                    const dt = (now - lastOrientationTime) / 1000.0;
                    
                    if (dt > 0.005 && dt < 0.2) {
                        let dAlpha = alpha - lastAlpha;
                        if (dAlpha > 180) dAlpha -= 360;
                        if (dAlpha < -180) dAlpha += 360;

                        let dBeta = beta - lastBeta;
                        if (dBeta > 180) dBeta -= 360;
                        if (dBeta < -180) dBeta += 360;

                        let dGamma = gamma - lastGamma;
                        if (dGamma > 90) dGamma -= 180;
                        if (dGamma < -90) dGamma += 180;

                        localGyro.x = dAlpha / dt;
                        localGyro.y = dBeta / dt;
                        localGyro.z = dGamma / dt;

                        let isLandscape = false;
                        let orientationAngle = 0;
                        if (typeof window.orientation !== 'undefined') {
                            orientationAngle = window.orientation;
                        } else if (screen && screen.orientation) {
                            orientationAngle = screen.orientation.angle;
                        }
                        
                        const sensMultiplier = parseFloat(sliderGyroSensitivity.value) / 10.0;
                        if (airMouseActive) {
                            sendPacket({
                                type: 'motion',
                                rx: localGyro.x * sensMultiplier,
                                ry: localGyro.y * sensMultiplier,
                                rz: localGyro.z * sensMultiplier
                            });
                        }
                    }
                }

                lastAlpha = alpha;
                lastBeta = beta;
                lastGamma = gamma;
                lastOrientationTime = now;
            });

            gyroEnabled = true;
        }

        function updateAirMouseState() {
            if (currentMode === 'airmouse') {
                airMouseActive = true;
                
                lastAlpha = null;
                lastBeta = null;
                lastGamma = null;
                lastOrientationTime = null;
            } else {
                airMouseActive = false;
            }
        }

        btnCalibrateGyro.addEventListener('click', (e) => {
            e.stopPropagation();
            vibrate(30);
            sendPacket({type: 'calibrate'});
            pulseGrid(PULSE_SUCCESS);
            
            lastAlpha = null;
            lastBeta = null;
            lastGamma = null;
            lastOrientationTime = null;
        });

        // Size and offset #scene to the visual viewport. Everything inside is
        // positioned against the scene, so nothing needs its own correction.
        if (window.visualViewport) {
            const vv = window.visualViewport;
            const scene = document.getElementById('scene');
            const updateKeyboardInset = () => {
                const layoutH = document.documentElement.clientHeight;
                // Match the scene to the visual viewport exactly: shifted down
                // by however far iOS scrolled, and only as tall as the area
                // that is actually visible above the keyboard. Everything
                // inside then lands correctly with no per-element offsets.
                const top = Math.round(vv.offsetTop);
                const h = Math.round(vv.height);
                scene.style.transform = `translateY(${top}px)`;
                scene.style.height = h + 'px';

                // Document left over below the scene — the strip the keyboard
                // covers. The dot grid and glow paint into it so neither ends
                // on a visible line.
                const inset = Math.max(0, layoutH - h);
                keyboardOpen = inset > 40 || top > 40;
                document.body.classList.toggle('kb-open', keyboardOpen);


            };
            vv.addEventListener('resize', updateKeyboardInset);
            vv.addEventListener('scroll', updateKeyboardInset);
            updateKeyboardInset();
        }

        // Voice Dictation (Hold to Speak) via Web Speech API
        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let speechRecognizer = null;
        let isSpeechRecording = false;
        let recognitionActive = false;
        let stopPending = false;
        let stopTimeout = null;

        if (SpeechRecognition) {
            speechRecognizer = new SpeechRecognition();
            speechRecognizer.continuous = false;
            speechRecognizer.interimResults = false;
            speechRecognizer.lang = navigator.language || 'en-US';

            speechRecognizer.onstart = () => {
                recognitionActive = true;
                if (stopPending) {
                    speechRecognizer.stop();
                    stopPending = false;
                }
            };

            speechRecognizer.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (!transcript) return;
                // Land it in the field un-sent so it can be read and corrected.
                textInput.value = (textInput.value ? textInput.value + ' ' : '') + transcript;
                setHolding(true);
                textInput.focus();
            };

            speechRecognizer.onerror = (event) => {
                console.error("Speech recognition error: ", event.error);
                if (event.error !== 'aborted') {
                    showToast("Speech Error: " + event.error);
                }
                recognitionActive = false;
                stopPending = false;
                isSpeechRecording = false;
                btnMic.classList.remove('recording');
                btnMic.classList.remove('processing');
                clearTimeout(stopTimeout);
            };

            speechRecognizer.onend = () => {
                recognitionActive = false;
                stopPending = false;
                isSpeechRecording = false;
                btnMic.classList.remove('recording');
                btnMic.classList.remove('processing');
                clearTimeout(stopTimeout);
            };

            // Touch event listeners for hold-to-speak
            btnMic.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                
                // If currently processing a previous release, cancel the stop timer and return to recording
                if (btnMic.classList.contains('processing')) {
                    clearTimeout(stopTimeout);
                    btnMic.classList.remove('processing');
                    btnMic.classList.add('recording');
                    isSpeechRecording = true;
                    vibrate(40);
                    return;
                }

                if (isSpeechRecording) return;

                isSpeechRecording = true;
                stopPending = false;
                recognitionActive = false;
                vibrate(40);
                btnMic.classList.add('recording');

                try {
                    speechRecognizer.start();
                } catch (err) {
                    console.error("Error starting speech recognizer: ", err);
                    showToast("Mic start failed: " + err.message);
                    isSpeechRecording = false;
                    recognitionActive = false;
                    stopPending = false;
                    btnMic.classList.remove('recording');
                }
            });

            const handleTouchEnd = (e) => {
                e.stopPropagation();
                if (!isSpeechRecording) return;

                isSpeechRecording = true; // Stay in speech recording state during transition
                isSpeechRecording = false;
                vibrate(15);
                
                // Shift visual state to "processing" to show active server analysis
                btnMic.classList.remove('recording');
                btnMic.classList.add('processing');
                
                // Delay stop call by 750ms so speech buffer flushes completely to the browser backend
                clearTimeout(stopTimeout);
                stopTimeout = setTimeout(() => {
                    if (recognitionActive) {
                        speechRecognizer.stop();
                    } else {
                        stopPending = true;
                    }
                }, 750);
            };

            btnMic.addEventListener('touchend', handleTouchEnd);
            btnMic.addEventListener('touchcancel', handleTouchEnd);
        } else {
            // Hide dictation button if Speech Recognition is not supported
            if (btnMic) btnMic.style.display = 'none';
        }

        // Initialize connection
        connectWS();

        // ── Screen Wake Lock ──────────────────────────────────────────────
        // Prevents the phone screen from sleeping while the app is open.
        // Re-acquires automatically when the tab becomes visible again.
        let wakeLock = null;

        async function acquireWakeLock() {
            if (!('wakeLock' in navigator)) return; // Not supported (iOS < 16.4)
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('[WakeLock] Screen lock acquired');
                wakeLock.addEventListener('release', () => {
                    console.log('[WakeLock] Released');
                    wakeLock = null;
                });
            } catch (err) {
                // User denied or device doesn't support — silent fail
                console.warn('[WakeLock] Could not acquire:', err.message);
            }
        }

        // Re-acquire when the page comes back into view (e.g. after switching app)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !wakeLock) {
                acquireWakeLock();
            }
        });

        acquireWakeLock();

        // ── Reactive Dot Grid (Ripple Physics) ──────────────────────────────
        const bgCanvas = document.getElementById('bg-canvas');
