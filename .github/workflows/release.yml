name: Release

# Tagging a version (e.g. `git tag v0.1.0 && git push --tags`) builds the menu
# bar app, packages it as a .dmg, and publishes it to a GitHub Release together
# with the Sparkle appcast the installed app polls for updates.
#
# Signing and notarization run only when the secrets below are present, so the
# workflow still produces a build without them — it just produces one that
# Gatekeeper blocks and whose updates would revoke the user's Accessibility
# grant. See ADR-0009.
#
# Secrets:
#   MACOS_CERT_P12 / MACOS_CERT_PASSWORD  Developer ID Application cert, base64
#   MACOS_SIGN_IDENTITY                   "Developer ID Application: NAME (TEAM)"
#   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID   notarytool credentials
#   SPARKLE_PRIVATE_KEY                   EdDSA private key (generate_keys -x)
#   SPARKLE_PUBLIC_KEY                    matching public key

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: ${{ secrets.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # A throwaway keychain, so the runner never touches a shared one.
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm cert.p12

      - name: Build .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SU_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SU_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          # v0.1.0 -> 0.1.0. Sparkle compares CFBundleVersion, so this has to
          # track the tag or no release is ever seen as newer than the last.
          APP_VERSION: ${{ github.ref_name }}
        run: |
          cd menubar
          export APP_VERSION="${APP_VERSION#v}"
          chmod +x build_app.sh make_dmg.sh
          ./make_dmg.sh release

      - name: Notarize and staple
        if: ${{ secrets.AC_API_KEY_P8 != '' }}
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > api_key.p8
          xcrun notarytool submit menubar/AirMouse.dmg \
            --key api_key.p8 \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          # Stapling matters: without it the app fails Gatekeeper on a machine
          # that is offline the first time it runs.
          xcrun stapler staple menubar/AirMouse.dmg
          rm api_key.p8

      - name: Generate Sparkle appcast
        if: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          cd menubar
          GENERATE_APPCAST="$(find .build/artifacts -name generate_appcast -type f -print -quit)"
          mkdir -p appcast_input
          cp AirMouse.dmg appcast_input/
          echo "$SPARKLE_PRIVATE_KEY" > eddsa_priv
          "$GENERATE_APPCAST" \
            --ed-key-file eddsa_priv \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            appcast_input
          rm eddsa_priv
          cp appcast_input/appcast.xml .

      - name: Compute checksum
        id: checksum
        run: |
          cd menubar
          echo "sha256=$(shasum -a 256 AirMouse.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd menubar
          ASSETS="AirMouse.dmg"
          [ -f appcast.xml ] && ASSETS="$ASSETS appcast.xml"
          # --prerelease until there is a Developer ID: Gatekeeper refuses the
          # first launch of an unsigned build, and labelling that as a finished
          # release sets an expectation the download does not meet.
          PRERELEASE=""
          [ -z "${{ secrets.MACOS_SIGN_IDENTITY }}" ] && PRERELEASE="--prerelease"

          # Built in a file rather than inline: YAML's block scalar strips this
          # indentation before the shell sees it, so the heredoc lands at column
          # zero, and a multi-line string inline would end the scalar instead.
          NOTES="$(mktemp)"
          {
            echo "SHA256 (AirMouse.dmg): ${{ steps.checksum.outputs.sha256 }}"
            if [ -n "$PRERELEASE" ]; then
              echo
              echo "This build is **not signed with a Developer ID**. macOS refuses the"
              echo "first launch with \"Air Mouse cannot be opened because the developer"
              echo "cannot be verified\". To open it: right-click Air Mouse in Applications"
              echo "and choose Open, then confirm. Double-clicking does not offer the option."
            fi
          } > "$NOTES"

          gh release create "${{ github.ref_name }}" \
            $ASSETS \
            --title "${{ github.ref_name }}" \
            $PRERELEASE \
            --generate-notes \
            --notes-file "$NOTES"
