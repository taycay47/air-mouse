# XcodeGen spec. Run `xcodegen generate` in this directory after editing.
#
# The .xcodeproj is generated, not committed: a pbxproj is a merge-conflict
# machine that nobody edits by hand, and this file is the part worth reviewing.
# It also means the project can be regenerated from a text diff rather than
# repaired through the Xcode GUI.

name: AirMouse
options:
  bundleIdPrefix: com.airmouse
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  # The gesture logic and wire types live here, not in the app target.
  # SourceKit-LSP handles SwiftPM packages well and .xcodeproj targets poorly,
  # so keeping the real work in the package is what makes this editable outside
  # Xcode — and it is what lets that code be unit-tested without a device.
  AirMouseKit:
    path: ../AirMouseKit

targets:
  AirMouse:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Icon Composer bundle. Gives the Liquid Glass treatment and the
      # light/dark/tinted variants iOS 26 renders, which a flat PNG cannot —
      # the system composites the layers itself rather than drawing a picture.
      - path: AirMouse.icon
      - path: Assets.xcassets
    dependencies:
      - package: AirMouseKit
        product: AirMouseProtocol
      - package: AirMouseKit
        product: AirMouseGestures
    # Local.xcconfig holds DEVELOPMENT_TEAM, which differs per developer and per
    # membership — committing one makes the project unbuildable for anyone else.
    # It is gitignored; see ios/Local.xcconfig.example.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airmouse.remote
        # Names the .icon bundle, not the asset catalog's AppIcon set. The
        # catalog's 1024 PNG stays as the fallback for anything that cannot
        # render a layered icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AirMouse
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait and landscape both: the protocol carries is_landscape
        # precisely so the phone can be held either way.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # The trackpad is the whole screen; a status bar over it is noise.
        INFOPLIST_KEY_UIStatusBarHidden: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM is deliberately absent. It differs per developer and
        # per membership, so committing one makes the project unbuildable for
        # everyone else. Supply it at build time:
        #   xcodebuild ... DEVELOPMENT_TEAM=XXXXXXXXXX -allowProvisioningUpdates
        # or put it in ios/Local.xcconfig, which is gitignored.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Air Mouse
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Both of these are required for Bonjour on iOS 14+, and their absence
        # fails *silently*: without NSBonjourServices the browser simply never
        # returns results, and without the usage description the local-network
        # prompt never appears, so discovery looks broken rather than denied.
        # Without this iOS caps third-party apps at 60Hz even on a 120Hz
        # display, silently. The dot grid is the app, and it was running at
        # half the refresh rate of the phone it was drawn on.
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: >-
          Air Mouse finds your Mac on your local network. Nothing is sent
          anywhere else.
        NSBonjourServices:
          - _airmouse._tcp
          # The fast channel advertises itself separately. Absent from this
          # list, the browse simply returns nothing — the same silent failure
          # the main service would have.
          - _airmouse-fast._udp
